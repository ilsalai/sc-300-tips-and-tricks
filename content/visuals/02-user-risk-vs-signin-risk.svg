<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Segoe UI, Inter, Arial, sans-serif">
<title>User risk vs sign-in risk</title>
<rect width="1280" height="720" fill="#0B1F3A"/>
<text x="48" y="62" font-size="34" font-weight="700" fill="#F8FAFC">User risk vs sign-in risk</text>
<text x="48" y="96" font-size="20" fill="#94A3B8">ID Protection (Entra ID P2): qué mide cada uno y cómo se remedia</text>
<rect x="1122" y="34" width="110" height="38" rx="19" fill="none" stroke="#22D3EE" stroke-width="2"/>
<text x="1177" y="60" font-size="20" font-weight="600" fill="#22D3EE" text-anchor="middle">SC-300</text>

<!-- User risk -->
<rect x="48" y="124" width="580" height="454" rx="12" fill="#132B4F" stroke="#22D3EE" stroke-opacity="0.3" stroke-width="1.5"/>
<circle cx="96" cy="168" r="24" fill="#22D3EE" fill-opacity="0.15" stroke="#22D3EE" stroke-width="2"/>
<circle cx="96" cy="161" r="7" fill="#22D3EE"/>
<path d="M83 181a13 11 0 0 1 26 0z" fill="#22D3EE"/>
<text x="134" y="177" font-size="28" font-weight="700" fill="#F8FAFC">User risk</text>
<line x1="72" y1="204" x2="604" y2="204" stroke="#22D3EE" stroke-opacity="0.2" stroke-width="1.5"/>
<text x="72" y="238" font-size="20" fill="#94A3B8">Qué indica</text>
<text x="72" y="268" font-size="22" font-weight="700" fill="#F8FAFC">Identity likely compromised</text>
<text x="72" y="308" font-size="20" fill="#94A3B8">Risk levels</text>
<rect x="72" y="322" width="100" height="36" rx="18" fill="#4ADE80" fill-opacity="0.15" stroke="#4ADE80" stroke-width="2"/>
<text x="122" y="347" font-size="20" fill="#4ADE80" text-anchor="middle">Low</text>
<rect x="184" y="322" width="120" height="36" rx="18" fill="#FBBF24" fill-opacity="0.15" stroke="#FBBF24" stroke-width="2"/>
<text x="244" y="347" font-size="20" fill="#FBBF24" text-anchor="middle">Medium</text>
<rect x="316" y="322" width="100" height="36" rx="18" fill="#F87171" fill-opacity="0.15" stroke="#F87171" stroke-width="2"/>
<text x="366" y="347" font-size="20" fill="#F87171" text-anchor="middle">High</text>
<text x="72" y="398" font-size="20" fill="#94A3B8">Remediation (CA grant)</text>
<text x="72" y="428" font-size="22" font-weight="700" fill="#4ADE80">Require password change <tspan font-size="20" font-weight="400" fill="#94A3B8">(+ MFA)</tspan></text>
<text x="72" y="468" font-size="20" fill="#94A3B8">Examples</text>
<g font-size="20" fill="#F8FAFC">
<text x="72" y="498">• Leaked credentials</text>
<text x="72" y="528">• Entra threat intelligence (user)</text>
<text x="72" y="558">• Anomalous user activity</text>
</g>

<!-- Sign-in risk -->
<rect x="652" y="124" width="580" height="454" rx="12" fill="#132B4F" stroke="#22D3EE" stroke-opacity="0.3" stroke-width="1.5"/>
<circle cx="700" cy="168" r="24" fill="#22D3EE" fill-opacity="0.15" stroke="#22D3EE" stroke-width="2"/>
<path d="M693 165v-6a7 7 0 0 1 14 0v6" fill="none" stroke="#22D3EE" stroke-width="3"/>
<rect x="688" y="164" width="24" height="17" rx="3" fill="#22D3EE"/>
<text x="738" y="177" font-size="28" font-weight="700" fill="#F8FAFC">Sign-in risk</text>
<line x1="676" y1="204" x2="1208" y2="204" stroke="#22D3EE" stroke-opacity="0.2" stroke-width="1.5"/>
<text x="676" y="238" font-size="20" fill="#94A3B8">Qué indica</text>
<text x="676" y="268" font-size="22" font-weight="700" fill="#F8FAFC">This sign-in likely not the owner</text>
<text x="676" y="308" font-size="20" fill="#94A3B8">Risk levels</text>
<rect x="676" y="322" width="100" height="36" rx="18" fill="#4ADE80" fill-opacity="0.15" stroke="#4ADE80" stroke-width="2"/>
<text x="726" y="347" font-size="20" fill="#4ADE80" text-anchor="middle">Low</text>
<rect x="788" y="322" width="120" height="36" rx="18" fill="#FBBF24" fill-opacity="0.15" stroke="#FBBF24" stroke-width="2"/>
<text x="848" y="347" font-size="20" fill="#FBBF24" text-anchor="middle">Medium</text>
<rect x="920" y="322" width="100" height="36" rx="18" fill="#F87171" fill-opacity="0.15" stroke="#F87171" stroke-width="2"/>
<text x="970" y="347" font-size="20" fill="#F87171" text-anchor="middle">High</text>
<text x="1036" y="347" font-size="20" fill="#94A3B8">Real-time</text>
<text x="676" y="398" font-size="20" fill="#94A3B8">Remediation (CA grant)</text>
<text x="676" y="428" font-size="22" font-weight="700" fill="#4ADE80">Require MFA <tspan font-size="20" font-weight="400" fill="#94A3B8">(o authentication strength)</tspan></text>
<text x="676" y="468" font-size="20" fill="#94A3B8">Examples</text>
<g font-size="20" fill="#F8FAFC">
<text x="676" y="498">• Atypical travel</text>
<text x="676" y="528">• Anonymous IP address</text>
<text x="676" y="558">• Unfamiliar sign-in properties</text>
</g>

<!-- banner -->
<rect x="48" y="598" width="1184" height="90" rx="12" fill="#22D3EE" fill-opacity="0.12" stroke="#22D3EE" stroke-width="2"/>
<line x1="640" y1="616" x2="640" y2="670" stroke="#22D3EE" stroke-opacity="0.5" stroke-width="2"/>
<g font-size="32" font-weight="700">
<text x="330" y="655" fill="#22D3EE" text-anchor="end">User risk</text>
<text x="344" y="655" fill="#F8FAFC">= password.</text>
<text x="982" y="655" fill="#22D3EE" text-anchor="end">Sign-in risk</text>
<text x="996" y="655" fill="#F8FAFC">= MFA.</text>
</g>
</svg>
