<rect width="1280" height="720" fill="#0B1F3A"/>
<text x="48" y="62" font-size="34" font-weight="700" fill="#F8FAFC">Entra logs y diagnostic settings</text>
<text x="48" y="96" font-size="20" fill="#94A3B8">Qué logs existen y cómo enviarlos fuera de Entra para retener y analizar</text>
<rect x="1122" y="34" width="110" height="38" rx="19" fill="none" stroke="#22D3EE" stroke-width="2"/>
<text x="1177" y="60" font-size="20" font-weight="600" fill="#22D3EE" text-anchor="middle">SC-300</text>

<!-- Entra logs -->
<rect x="48" y="124" width="372" height="564" rx="12" fill="#132B4F" stroke="#22D3EE" stroke-opacity="0.35" stroke-width="1.5"/>
<text x="72" y="164" font-size="24" font-weight="700" fill="#F8FAFC">Entra logs</text>
<text x="72" y="208" font-size="22" font-weight="700" fill="#7DD3FC">Sign-in logs</text>
<g font-size="20" fill="#F8FAFC">
<text x="88" y="240">• Interactive</text>
<text x="88" y="270">• Non-interactive</text>
<text x="88" y="300">• Service principal</text>
<text x="88" y="330">• Managed identity</text>
</g>
<text x="72" y="376" font-size="22" font-weight="700" fill="#7DD3FC">Audit logs</text>
<text x="88" y="406" font-size="20" fill="#94A3B8">Cambios en el directorio</text>
<text x="72" y="450" font-size="22" font-weight="700" fill="#7DD3FC">Provisioning logs</text>
<text x="88" y="480" font-size="20" fill="#94A3B8">Apps (SCIM), HR, Cloud Sync</text>
<text x="72" y="524" font-size="22" font-weight="700" fill="#7DD3FC">Risky users</text>
<text x="88" y="554" font-size="20" fill="#94A3B8">+ risk detections</text>
<rect x="64" y="584" width="340" height="88" rx="10" fill="#FBBF24" fill-opacity="0.12" stroke="#FBBF24" stroke-width="1.5"/>
<text x="84" y="618" font-size="20" font-weight="700" fill="#FBBF24">Retención por defecto</text>
<text x="84" y="650" font-size="20" fill="#F8FAFC">7 días Free, 30 días P1/P2</text>

<!-- Diagnostic settings -->
<rect x="468" y="266" width="232" height="150" rx="12" fill="#22D3EE" fill-opacity="0.16" stroke="#22D3EE" stroke-width="2.5"/>
<g text-anchor="middle">
<text x="584" y="314" font-size="24" font-weight="700" fill="#F8FAFC">Diagnostic</text>
<text x="584" y="342" font-size="24" font-weight="700" fill="#F8FAFC">settings</text>
<text x="584" y="380" font-size="20" fill="#7DD3FC">Categorías + destino</text>
</g>
<rect x="468" y="440" width="232" height="108" rx="12" fill="#132B4F" stroke="#94A3B8" stroke-opacity="0.5" stroke-width="1.5"/>
